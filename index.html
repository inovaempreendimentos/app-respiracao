<style>
  :root{
    --bg:#0e1420; --bg-soft:#141b29; --card:#182233; --card-border:#263349;
    --text:#f2efe8; --text-dim:#a8b3c4; --accent:#7fc4e0;
  }
  html{ color-scheme: dark; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background-color:var(--bg); color:var(--text); font-family:'Sora',sans-serif; min-height:100vh; overflow-x:hidden; }
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px;
    background: radial-gradient(circle at 20% 15%, rgba(127,196,224,0.09), transparent 40%),
                radial-gradient(circle at 80% 85%, rgba(147,197,253,0.06), transparent 40%),
                var(--bg);
  }
  .app{ width:100%; max-width:580px; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em; }
  .screen{ display:none; animation: fadeUp .5s ease both; }
  .screen.active{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .lang-switch{ display:flex; justify-content:center; gap:8px; margin-bottom:26px; }
  .lang-btn{ background:var(--card); border:1px solid var(--card-border); color:var(--text-dim); font-family:'Sora',sans-serif; font-weight:700;
    font-size:11.5px; padding:6px 14px; border-radius:100px; cursor:pointer; letter-spacing:0.04em; }
  .lang-btn.active{ border-color:var(--accent); color:var(--accent); }

  .interval-btn{ background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text-dim); font-family:'Sora',sans-serif; font-weight:700;
    font-size:13px; padding:9px 22px; border-radius:100px; cursor:pointer; letter-spacing:0.02em; transition:border-color .15s ease, color .15s ease; }
  .interval-btn.active{ border-color:var(--accent); color:var(--accent); background:rgba(127,196,224,0.08); }

  .hero{ text-align:center; }
  .eyebrow{ font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; font-weight:700; }
  .hero h1{ font-size:clamp(28px,6vw,36px); line-height:1.18; margin-bottom:14px; }
  .hero p{ color:#c3cbd8; font-size:15px; line-height:1.65; max-width:440px; margin:0 auto 30px; }

  .practice-list{ display:flex; flex-direction:column; gap:12px; }
  .practice-card{ display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:18px 20px; cursor:pointer; text-align:left; transition:border-color .15s ease, transform .15s ease; }
  .practice-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .practice-card.locked{ opacity:0.72; }
  .practice-card.locked .practice-meta{ color:#e8c76f; }
  .practice-emoji{ font-size:26px; width:48px; height:48px; border-radius:12px; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .practice-info{ flex:1; }
  .practice-name{ font-size:15.5px; font-weight:600; margin-bottom:3px; font-family:'Fraunces',serif; }
  .practice-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.45; }
  .practice-meta{ font-size:11px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; flex-shrink:0; text-align:right; }

  .back-link{ display:inline-block; margin-top:20px; font-size:12px; color:var(--text-dim); cursor:pointer; background:none; border:none; font-family:'Sora',sans-serif; }
  .back-link:hover{ color:var(--text); }

  .session-wrap{ text-align:center; }
  .session-title{ font-size:13px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .session-cycles{ font-size:12px; color:var(--text-dim); margin-bottom:36px; }

  .breath-orb-wrap{ width:240px; height:240px; margin:0 auto 30px; position:relative; display:flex; align-items:center; justify-content:center; }
  .breath-orb{ width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(127,196,224,0.9), rgba(79,140,180,0.5) 60%, rgba(79,140,180,0.15) 100%);
    box-shadow:0 0 60px rgba(127,196,224,0.35); transition:transform 1s ease-in-out; }
  .breath-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(127,196,224,0.25); }
  .breath-phase-label{ font-family:'Fraunces',serif; font-size:26px; font-weight:500; margin-bottom:8px; min-height:34px; }
  .breath-timer{ font-size:14px; color:var(--text-dim); margin-bottom:34px; }

  .session-controls{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:26px; }

  button.primary{ background:var(--text); color:var(--bg); border:none; font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
    padding:14px 30px; border-radius:100px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  button.primary:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(242,239,232,0.12); }
  button.ghost{ background:transparent; border:1px solid var(--card-border); color:var(--text); font-family:'Sora',sans-serif; font-weight:600;
    font-size:13.5px; padding:13px 22px; border-radius:100px; cursor:pointer; transition:border-color .15s ease; }
  button.ghost:hover{ border-color:var(--accent); }
  button.ghost.active-toggle{ border-color:var(--accent); color:var(--accent); }

  .settings-card{ background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:18px 20px; text-align:left; margin-top:10px; }
  .settings-row{ margin-bottom:14px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-label{ font-size:12px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; display:block; }
  select.settings-select{ width:100%; background:var(--bg-soft); border:1px solid var(--card-border); border-radius:10px; padding:11px 12px;
    color:var(--text); font-family:'Sora',sans-serif; font-size:13.5px; }
  input.settings-slider{ width:100%; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
</style>

<div class="app">

  <!-- HOME -->

  <!-- PAYWALL -->

    </div>
    <button class="back-link" id="t-back-home" onclick="goTo('screen-home')"></button>
  </section>

  <!-- CONFIG DA SESSÃO -->
  <section class="screen" id="screen-settings-intro">
    <div class="hero">
      <div class="eyebrow" id="settings-practice-name"></div>
      <h1 id="t-before-start"></h1>
      <p id="settings-practice-desc"></p>
    </div>
    <div class="settings-card">
      <div class="settings-row">
        <span class="settings-label" id="t-voice-label"></span>
        <select class="settings-select" id="voice-select"></select>
        <button type="button" class="back-link" id="voice-toggle-all" onclick="toggleAllVoices()" style="margin-top:8px; padding:0;"></button>
      </div>
      <div class="settings-row">
        <span class="settings-label" id="t-voice-volume-label"></span>
        <input type="range" class="settings-slider" id="voice-volume" min="0" max="1" step="0.05" value="0.9">
      </div>
      <div class="settings-row">
        <span class="settings-label" id="t-music-label"></span>
        <input type="range" class="settings-slider" id="music-volume" min="0" max="1" step="0.05" value="0.4">
      </div>
    </div>
    <div class="session-controls" style="margin-top:24px;">
      <button class="primary" id="t-start-btn" onclick="startSession()"></button>
    </div>
    <button class="back-link" id="t-back-choose" onclick="goTo('screen-home')"></button>
  </section>

  <!-- SESSÃO -->
  <section class="screen" id="screen-session">
    <div class="session-wrap">
      <div class="session-title" id="session-practice-name"></div>
      <div class="session-cycles" id="session-cycle-count"></div>

      <div class="breath-orb-wrap">
        <div class="breath-ring"></div>
        <div class="breath-orb" id="breath-orb"></div>
      </div>

      <div class="breath-phase-label" id="breath-phase-label"></div>
      <div class="breath-timer" id="breath-timer"></div>

      <div class="session-controls">
        <button class="ghost" id="pause-btn" onclick="togglePause()"></button>
        <button class="ghost" id="voice-toggle-btn" onclick="toggleVoice()"></button>
        <button class="ghost" id="music-toggle-btn" onclick="toggleMusic()"></button>
      </div>
      <button class="back-link" id="t-end-session" onclick="endSession()"></button>
    </div>
  </section>

</div>

    startBtn:'Start breathing', backChoose:'← Choose another practice', backHome:'← Back',
    pause:'Pause', resume:'Resume', voiceOn:'🔊 Voice', voiceOff:'🔇 Voice', musicOn:'🎵 Music', musicOff:'🔈 Music',
    endSession:'End session', sessionDone:'Session complete 🌿',
    paywallEyebrow:'Subscription', paywallTitle:'Unlock every practice.',
    paywallSub:'Advanced practices and everything we add next — all included, with guided voice and ambient music.',
    perMonth:'/mo', perYear:'/yr', yearlySavings:'Equivalent to 2 months free', cancelAnytime:'Cancel anytime, no fees', subscribeBtn:'Subscribe now',

    startBtn:'Empezar a respirar', backChoose:'← Elegir otra práctica', backHome:'← Volver',
    pause:'Pausar', resume:'Continuar', voiceOn:'🔊 Voz', voiceOff:'🔇 Voz', musicOn:'🎵 Música', musicOff:'🔈 Música',
    endSession:'Terminar sesión', sessionDone:'Sesión completa 🌿',
    paywallEyebrow:'Suscripción', paywallTitle:'Desbloquea todas las prácticas.',
    paywallSub:'Prácticas avanzadas y todo lo que agreguemos después, todo incluido, con voz guiada y música ambiente.',
    perMonth:'/mes', perYear:'/año', yearlySavings:'Equivale a 2 meses gratis', cancelAnytime:'Cancela cuando quieras, sin penalización', subscribeBtn:'Suscribirme ahora',
    subscriptionTag:'Suscripción', cyclesWord:'ciclos', cycleOf:(a,b)=>`Ciclo ${a} de ${b}`,
    showAllVoices:n=>`Ver todas las voces (${n})`, showLocalVoices:'Mostrar solo voces en este idioma',
    phase:{inspire:'Inhala', segure:'Mantén', expire:'Exhala'}
  }
};

const PRICING_TIERS = {
  usd: { currency:'usd', symbol:'$', monthly:690, yearly:6900 },   // moeda forte não-europeia (EUA, Canadá, Reino Unido, etc.)
  eur: { currency:'eur', symbol:'€', monthly:690, yearly:6900 },   // zona do euro
  brl: { currency:'brl', symbol:'R$', monthly:990, yearly:9900 }   // Brasil
};

const EUR_REGIONS = ['DE','FR','ES','IT','NL','BE','AT','FI','IE','PT','GR','SK','SI','LU','MT','CY','EE','LV','LT'];
const USD_REGIONS = ['US','CA','GB','AU','NZ','JP','SG','CH','SE','NO','DK'];
// Países da América do Sul com moeda própria: convertidos ao vivo, mesmo valor real do Brasil.
const LATAM_CURRENCY_MAP = { AR:'ARS', CL:'CLP', CO:'COP', PE:'PEN', UY:'UYU', EC:'USD' };
const ZERO_DECIMAL_CURRENCIES = ['clp'];

function detectPricingInfo(){
  const saved = localStorage.getItem('arterespirar_pricing_info');
  if(saved){ try{ return JSON.parse(saved); }catch(e){} }

  const lang = navigator.language || 'en-US';
  const parts = lang.split('-');
  const region = parts.length > 1 ? parts[1].toUpperCase() : null;

  let info;
  if(region && EUR_REGIONS.includes(region)) info = { tier:'eur', country:region };
  else if(region && USD_REGIONS.includes(region)) info = { tier:'usd', country:region };
  else if(region === 'BR') info = { tier:'brl', country:'BR' };
  else if(region && LATAM_CURRENCY_MAP[region]) info = { tier:'latam', country:region, currency:LATAM_CURRENCY_MAP[region] };
  else if(parts[0].toLowerCase() === 'en') info = { tier:'usd', country:region || 'US' };
  else info = { tier:'brl', country:region || 'BR' };

  try{ localStorage.setItem('arterespirar_pricing_info', JSON.stringify(info)); }catch(e){}
  return info;
}
let pricingInfo = detectPricingInfo();
let billingInterval = 'month'; // 'month' | 'year'
let latamEstimate = null; // preenchido de forma assíncrona pra tier 'latam'

function formatMoney(amount, currency){
  const isZero = ZERO_DECIMAL_CURRENCIES.includes(currency.toLowerCase());
  const value = isZero ? amount : amount / 100;
  try{
    return new Intl.NumberFormat(undefined, { style:'currency', currency:currency.toUpperCase(), maximumFractionDigits: isZero?0:2 }).format(value);
  }catch(e){
    return (isZero ? '' : '') + value.toFixed(isZero?0:2);
  }
}

async function fetchLatamEstimate(){
  if(pricingInfo.tier !== 'latam' || pricingInfo.currency === 'USD') return;
  try{
    const res = await fetch(`https://api.frankfurter.app/latest?from=BRL&to=${pricingInfo.currency}`);
    const data = await res.json();
    const rate = data.rates[pricingInfo.currency];
    if(!rate) return;
    const isZero = ZERO_DECIMAL_CURRENCIES.includes(pricingInfo.currency.toLowerCase());
    const monthlyBRL = PRICING_TIERS.brl.monthly / 100;
    const yearlyBRL = PRICING_TIERS.brl.yearly / 100;
    latamEstimate = {
      monthly: Math.round(monthlyBRL * rate * (isZero ? 1 : 100)),
      yearly: Math.round(yearlyBRL * rate * (isZero ? 1 : 100))
    };
    updatePriceDisplay();
  }catch(e){ /* se falhar, mantém undefined e cai no fallback de exibição em BRL */ }
}

function setInterval_(interval){
  billingInterval = interval;
  document.getElementById('btn-monthly').classList.toggle('active', interval === 'month');
  document.getElementById('btn-yearly').classList.toggle('active', interval === 'year');
  updatePriceDisplay();
}

function updatePriceDisplay(){
  const note = document.getElementById('yearly-savings-note');
  let displayText = '';

  if(pricingInfo.tier === 'latam'){
    if(pricingInfo.currency === 'USD'){
      const amt = billingInterval === 'month' ? PRICING_TIERS.usd.monthly : PRICING_TIERS.usd.yearly;
      displayText = formatMoney(amt, 'usd');
    } else if(latamEstimate){
      const amt = billingInterval === 'month' ? latamEstimate.monthly : latamEstimate.yearly;
      displayText = formatMoney(amt, pricingInfo.currency);
    } else {
      displayText = '...';
    }
  } else {
    const tierData = PRICING_TIERS[pricingInfo.tier];
    const amt = billingInterval === 'month' ? tierData.monthly : tierData.yearly;
    displayText = formatMoney(amt, tierData.currency);
  }

  document.getElementById('price-display').textContent = displayText;
  const permonthEl = document.getElementById('t-permonth');
  if(permonthEl){ permonthEl.textContent = billingInterval === 'month' ? t('perMonth') : t('perYear'); }
  note.style.display = billingInterval === 'year' ? 'block' : 'none';
  if(note.style.display === 'block'){ note.textContent = t('yearlySavings'); }
}

function detectLocale(){
  const saved = localStorage.getItem('arterespirar_locale');
  if(saved && SUPPORTED_LOCALES.includes(saved)) return saved;
  const browserLang = (navigator.language || 'en').slice(0,2).toLowerCase();
  return SUPPORTED_LOCALES.includes(browserLang) ? browserLang : 'en';
}
let currentLocale = detectLocale();

function t(key){ return UI[currentLocale][key]; }

function setLocale(loc){
  currentLocale = loc;
  localStorage.setItem('arterespirar_locale', loc);
  document.getElementById('html-root').lang = loc === 'pt' ? 'pt-BR' : loc;
  applyTranslations();
  renderLangSwitch();
  renderPracticeList();
  loadVoices();
}

function renderLangSwitch(){
  const el = document.getElementById('lang-switch');
  el.innerHTML = SUPPORTED_LOCALES.map(loc=>
    `<button class="lang-btn ${loc===currentLocale?'active':''}" onclick="setLocale('${loc}')">${LOCALE_NAMES[loc]}</button>`
  ).join('');
}

function applyTranslations(){
  document.getElementById('page-title').textContent = t('homeEyebrow');
  document.getElementById('t-home-eyebrow').textContent = t('homeEyebrow');
  document.getElementById('t-home-title').textContent = t('homeTitle');
  document.getElementById('t-home-sub').textContent = t('homeSub');
  document.getElementById('t-before-start').textContent = t('beforeStart');
  document.getElementById('t-voice-label').textContent = t('voiceLabel');
  document.getElementById('t-voice-volume-label').textContent = t('voiceVolumeLabel');
  document.getElementById('t-music-label').textContent = t('musicLabel');
  document.getElementById('t-start-btn').textContent = t('startBtn');
  document.getElementById('t-back-choose').textContent = t('backChoose');
  document.getElementById('t-end-session').textContent = t('endSession');
  document.getElementById('t-paywall-eyebrow').textContent = t('paywallEyebrow');
  document.getElementById('t-paywall-title').textContent = t('paywallTitle');
  document.getElementById('t-paywall-sub').textContent = t('paywallSub');
  document.getElementById('t-permonth').textContent = t('perMonth');
  document.getElementById('t-cancel-anytime').textContent = t('cancelAnytime');
  document.getElementById('subscribe-btn').textContent = t('subscribeBtn');
  document.getElementById('t-back-home').textContent = t('backHome');
  updatePriceDisplay();
  document.getElementById('pause-btn').textContent = sessionPaused ? t('resume') : t('pause');
  document.getElementById('voice-toggle-btn').textContent = voiceEnabled ? t('voiceOn') : t('voiceOff');
  document.getElementById('music-toggle-btn').textContent = musicEnabled ? t('musicOn') : t('musicOff');
}

/* ================= PRÁTICAS ================= */
const PRACTICES = [
  { id:'478', emoji:'🌙', premium:false, cycles:6, pattern:[{phase:'inspire',s:4},{phase:'segure',s:7},{phase:'expire',s:8}],

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function renderPracticeList(){
  const el = document.getElementById('practice-list');
  el.innerHTML = '';
  PRACTICES.forEach(p=>{
    const locked = p.premium && !isSubscribed;
    const info = p.i18n[currentLocale];
    const card = document.createElement('div');
    card.className = 'practice-card' + (locked ? ' locked' : '');
    card.onclick = ()=> locked ? goTo('screen-paywall') : openSettingsFor(p.id);
    card.innerHTML = `
      <div class="practice-emoji">${p.emoji}</div>
      <div class="practice-info">
        <div class="practice-name">${info.name} ${locked ? '🔒' : ''}</div>
        <div class="practice-desc">${info.desc}</div>
      </div>
      <div class="practice-meta">${locked ? t('subscriptionTag') : (p.cycles + ' ' + t('cyclesWord'))}</div>
    `;
    el.appendChild(card);
  });
}

/* ================= VOZ ================= */
let availableVoices = [];
let selectedVoice = null;
let voiceEnabled = true;
let allVoicesExpanded = false;

function loadVoices(){
  availableVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const select = document.getElementById('voice-select');
  if(!availableVoices.length){
    select.innerHTML = '<option value="">-</option>';
    return;
  }
  const localVoices = availableVoices.filter(v=> v.lang && v.lang.toLowerCase().startsWith(currentLocale));
  const otherVoices = availableVoices.filter(v=> !(v.lang && v.lang.toLowerCase().startsWith(currentLocale)));
  const ordered = (allVoicesExpanded || localVoices.length === 0) ? localVoices.concat(otherVoices) : localVoices;

  select.innerHTML = ordered.map(v=> `<option value="${v.name}">${v.name}${allVoicesExpanded ? ' ('+v.lang+')' : ''}</option>`).join('');
  const savedName = localStorage.getItem('arterespirar_voice_' + currentLocale);
  const savedVoice = ordered.find(v=>v.name===savedName);
  selectedVoice = savedVoice || ordered[0] || null;
  if(selectedVoice) select.value = selectedVoice.name;

  const toggleEl = document.getElementById('voice-toggle-all');
  if(toggleEl){
    toggleEl.style.display = otherVoices.length > 0 ? 'inline' : 'none';
    toggleEl.textContent = allVoicesExpanded ? t('showLocalVoices') : t('showAllVoices')(availableVoices.length);
  }
}
function toggleAllVoices(){
  allVoicesExpanded = !allVoicesExpanded;
  loadVoices();
}
if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged = loadVoices; }

function speakPhase(phaseWord){
  if(!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(phaseWord);
  if(selectedVoice) utter.voice = selectedVoice;
  utter.rate = 0.82;
  utter.pitch = 0.95;
  utter.volume = parseFloat(document.getElementById('voice-volume').value || 0.9);
  window.speechSynthesis.speak(utter);
}

function toggleVoice(){
  voiceEnabled = !voiceEnabled;
  document.getElementById('voice-toggle-btn').classList.toggle('active-toggle', voiceEnabled);
  document.getElementById('voice-toggle-btn').textContent = voiceEnabled ? t('voiceOn') : t('voiceOff');
  if(!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
}

/* ================= MÚSICA AMBIENTE ================= */
let audioCtx = null;
let musicNodes = null;
let musicEnabled = true;
let musicTimer = null;

function ensureAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function playChord(freqs, duration, startTime, masterGain){
  freqs.forEach(freq=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.16, startTime + 3);
    gain.gain.linearRampToValueAtTime(0.16, startTime + duration - 3);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.5);
  });
}
function startMusic(){
  if(!musicEnabled) return;
  ensureAudioCtx();
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = parseFloat(document.getElementById('music-volume').value || 0.4);
  masterGain.connect(audioCtx.destination);
  musicNodes = { masterGain };
  const chords = [[146.83,174.61,220.00],[174.61,220.00,261.63]];
  const chordDuration = 9;
  let chordIndex = 0;
  function scheduleNext(){
    if(!musicEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    playChord(chords[chordIndex % chords.length], chordDuration, now, masterGain);
    chordIndex++;
    musicTimer = setTimeout(scheduleNext, (chordDuration - 1) * 1000);
  }
  scheduleNext();
}
function stopMusic(){
  if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
  if(musicNodes && musicNodes.masterGain){
    musicNodes.masterGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.5);
  }
  musicNodes = null;
}
function toggleMusic(){
  musicEnabled = !musicEnabled;
  document.getElementById('music-toggle-btn').classList.toggle('active-toggle', musicEnabled);
  document.getElementById('music-toggle-btn').textContent = musicEnabled ? t('musicOn') : t('musicOff');
  if(musicEnabled){ startMusic(); } else { stopMusic(); }
}

/* ================= ASSINATURA ================= */
let isSubscribed = false;

async function subscribe(){
  const btn = document.getElementById('subscribe-btn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '...';
  try{
    const res = await fetch('/api/create-checkout-session', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tier: pricingInfo.tier, country: pricingInfo.country, interval: billingInterval })
    });
    const data = await res.json();
    if(data.url){ window.location.href = data.url; }
    else{ throw new Error(data.error || 'checkout error'); }
  }catch(err){
    alert(currentLocale==='pt' ? 'Não foi possível iniciar o pagamento agora.' : currentLocale==='es' ? 'No se pudo iniciar el pago ahora.' : 'Could not start checkout right now.');
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function checkExistingSubscription(){
  const subId = localStorage.getItem('arterespirar_subscription_id');
  if(!subId){ isSubscribed = false; return; }
  try{
    const res = await fetch(`/api/check-subscription?subscription_id=${encodeURIComponent(subId)}`);
    const data = await res.json();
    isSubscribed = !!data.active;
    if(!isSubscribed){ localStorage.removeItem('arterespirar_subscription_id'); }
  }catch(e){ isSubscribed = false; }
}

async function handlePaymentReturn(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('paid') === '1' && params.get('session_id')){
    try{
      const res = await fetch(`/api/verify-session?session_id=${encodeURIComponent(params.get('session_id'))}`);
      const data = await res.json();
      window.history.replaceState({}, '', window.location.pathname);
      if(data.active && data.subscriptionId){
        localStorage.setItem('arterespirar_subscription_id', data.subscriptionId);
        isSubscribed = true;
      }
    }catch(e){}
  }
}

/* ================= SESSÃO ================= */
let currentPractice = null;
let sessionRunning = false;
let sessionPaused = false;
let cycleCount = 0;
let phaseIndex = 0;
let phaseTimeLeft = 0;
let sessionTickInterval = null;

function openSettingsFor(practiceId){
  currentPractice = PRACTICES.find(p=>p.id===practiceId);
  const info = currentPractice.i18n[currentLocale];
  document.getElementById('settings-practice-name').textContent = info.name;
  document.getElementById('settings-practice-desc').textContent = info.desc;
  loadVoices();
  goTo('screen-settings-intro');
}

function startSession(){
  const voiceSelect = document.getElementById('voice-select');
  selectedVoice = availableVoices.find(v=>v.name===voiceSelect.value) || selectedVoice;
  if(selectedVoice) localStorage.setItem('arterespirar_voice_' + currentLocale, selectedVoice.name);

  voiceEnabled = true;
  musicEnabled = true;
  document.getElementById('voice-toggle-btn').textContent = t('voiceOn');
  document.getElementById('music-toggle-btn').textContent = t('musicOn');
  document.getElementById('voice-toggle-btn').classList.add('active-toggle');
  document.getElementById('music-toggle-btn').classList.add('active-toggle');
  document.getElementById('pause-btn').textContent = t('pause');

  document.getElementById('session-practice-name').textContent = currentPractice.i18n[currentLocale].name;
  cycleCount = 0;
  phaseIndex = 0;
  sessionPaused = false;
  sessionRunning = true;

  goTo('screen-session');
  startMusic();
  runPhase();
}

function updateCycleLabel(){
  document.getElementById('session-cycle-count').textContent = t('cycleOf')(Math.min(cycleCount+1, currentPractice.cycles), currentPractice.cycles);
}

function runPhase(){
  if(!sessionRunning) return;
  if(cycleCount >= currentPractice.cycles){ finishSession(); return; }
  const phase = currentPractice.pattern[phaseIndex];
  phaseTimeLeft = phase.s;
  updateCycleLabel();

  document.getElementById('breath-phase-label').textContent = t('phase')[phase.phase];
  document.getElementById('breath-timer').textContent = phaseTimeLeft + 's';

  const orb = document.getElementById('breath-orb');
  if(phase.phase === 'inspire'){ orb.style.transform = 'scale(1.7)'; orb.style.transitionDuration = phase.s + 's'; }
  else if(phase.phase === 'expire'){ orb.style.transform = 'scale(1)'; orb.style.transitionDuration = phase.s + 's'; }

  speakPhase(t('phase')[phase.phase]);

  clearInterval(sessionTickInterval);
  sessionTickInterval = setInterval(()=>{
    if(sessionPaused) return;
    phaseTimeLeft--;
    document.getElementById('breath-timer').textContent = Math.max(phaseTimeLeft,0) + 's';
    if(phaseTimeLeft <= 0){
      clearInterval(sessionTickInterval);
      phaseIndex++;
      if(phaseIndex >= currentPractice.pattern.length){ phaseIndex = 0; cycleCount++; }
      runPhase();
    }
  }, 1000);
}

function togglePause(){
  sessionPaused = !sessionPaused;
  document.getElementById('pause-btn').textContent = sessionPaused ? t('resume') : t('pause');
  if(sessionPaused && window.speechSynthesis){ window.speechSynthesis.cancel(); }
}

function finishSession(){
  sessionRunning = false;
  clearInterval(sessionTickInterval);
  document.getElementById('breath-phase-label').textContent = t('sessionDone');
  document.getElementById('breath-timer').textContent = '';
  stopMusic();
}

function endSession(){
  sessionRunning = false;
  clearInterval(sessionTickInterval);
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  stopMusic();
  goTo('screen-home');
}

  renderLangSwitch();
  applyTranslations();

  loadVoices();
  fetchLatamEstimate();
});
